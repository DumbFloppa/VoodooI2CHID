name: Build VoodooI2CHID

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with: 
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Check Xcode project
        run: |
          xcodebuild -list \
            -project VoodooI2CHID.xcodeproj

      - name: Build VoodooI2CHID
        run: |
          set -o pipefail
          KERNEL_EXTENSION_HEADER_SEARCH_PATHS="/Users/runner/work/VoodooI2CHID/VoodooI2CHID/MacKernelSDK/Headers"
          KERNEL_FRAMEWORK_HEADERS="/Users/runner/work/VoodooI2CHID/VoodooI2CHID/MacKernelSDK/Headers"
          LIBRARY_SEARCH_PATHS="/Users/runner/work/VoodooI2CHID/VoodooI2CHID/MacKernelSDK/Library/x86_64"
          xcodebuild \
            -project VoodooI2CHID.xcodeproj \
            -scheme VoodooI2CHID \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package kext
        run: |
          set -e

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products"
          KEXT=$(find "$PRODUCTS" \
            -type d -name "VoodooI2CHID.kext" -print -quit)

          if [ -z "$KEXT" ]; then
            echo "VoodooI2CHID.kext not found"
            find "$PRODUCTS" -maxdepth 3 -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/artifacts"

          ditto -c -k --sequesterRsrc --keepParent \
            "$KEXT" \
            "$RUNNER_TEMP/artifacts/VoodooI2CHID.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VoodooI2CHID-kext
          path: ${{ runner.temp }}/artifacts/VoodooI2CHID.zip
          if-no-files-found: error